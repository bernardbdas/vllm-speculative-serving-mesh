services:
  serving-api:
    build: .
    ports:
      - "8003:8003"
      - "9090:9090"
    environment:
      - CUDA_VISIBLE_DEVICES=0,1,2,3
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis/redis-stack:latest
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
