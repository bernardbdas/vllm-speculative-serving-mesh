[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vllm-speculative-serving-mesh"
version = "1.0.0"
description = "Ultra-Low-Latency Real-Time LLM Serving Mesh with Speculative Decoding & Custom Triton Kernels"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Bernard B. Das", email = "bernard@example.com" }
]
dependencies = [
    "torch>=2.3.0",
    "vllm>=0.4.3; sys_platform == 'linux'",
    "triton>=2.3.0; sys_platform == 'linux'",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "redis>=5.0.4",
    "pydantic>=2.7.0",
    "prometheus-client>=0.20.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "locust>=2.28.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.4",
    "pre-commit>=3.8.0",
]

[project.scripts]
serving-mesh = "src.server:run_server"
mesh-cli = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
